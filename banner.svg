<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 300" width="100%" role="img" aria-label="Banner animado: Técnico em Informática, Help Desk e Suporte N1" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117">
        <animate attributeName="stop-color" values="#0d1117;#0b1d3a;#1a1033;#0d1117" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#14233f">
        <animate attributeName="stop-color" values="#14233f;#1d1340;#0c2b3a;#14233f" dur="14s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#58a6ff" stroke-opacity="0.08" stroke-width="1"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 40" dur="6s" repeatCount="indefinite"/>
    </pattern>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="clipTitle">
      <rect x="60" y="120" height="60" width="0">
        <animate attributeName="width" values="0;640;640;0" keyTimes="0;0.3;0.9;1" dur="10s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="clipCmd">
      <rect x="60" y="62" height="34" width="0">
        <animate attributeName="width" values="0;330;330;0" keyTimes="0;0.2;0.9;1" dur="10s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="clipSub">
      <rect x="60" y="196" height="36" width="0">
        <animate attributeName="width" values="0;0;640;640;0" keyTimes="0;0.3;0.5;0.9;1" dur="10s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Courier New', monospace; }
    .cmd { fill: #3fb950; font-size: 20px; }
    .title { fill: #f0f6fc; font-size: 38px; font-weight: 700; }
    .sub { fill: #8b949e; font-size: 20px; }
    .ok { fill: #3fb950; font-size: 16px; animation: blink 1.6s ease-in-out infinite; }
    .flow { stroke-dasharray: 6 8; animation: dash 1.4s linear infinite; }
    .float { animation: float 5s ease-in-out infinite; }
    .float2 { animation: float 7s ease-in-out infinite reverse; }
    @keyframes dash { to { stroke-dashoffset: -28; } }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  </style>

  <!-- Fundo -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- Linha de varredura -->
  <rect x="0" y="-4" width="1200" height="3" fill="#58a6ff" opacity="0.18">
    <animate attributeName="y" values="-4;300" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Rede (lado direito) -->
  <g>
    <!-- Linhas -->
    <g stroke="#58a6ff" stroke-opacity="0.55" stroke-width="1.6" fill="none">
      <path class="flow" d="M930 140 L760 80"/>
      <path class="flow" d="M930 140 L880 235"/>
      <path class="flow" d="M930 140 L1040 60"/>
      <path class="flow" d="M930 140 L1110 190"/>
      <path class="flow" d="M930 140 L1030 255"/>
      <path class="flow" d="M760 80 L880 235" stroke-opacity="0.25"/>
      <path class="flow" d="M1040 60 L1110 190" stroke-opacity="0.25"/>
    </g>

    <!-- Pacotes de dados -->
    <g fill="#3fb950">
      <circle r="4"><animateMotion dur="2.4s" repeatCount="indefinite" path="M760 80 L930 140"/></circle>
      <circle r="4"><animateMotion dur="3.1s" repeatCount="indefinite" path="M930 140 L880 235"/></circle>
      <circle r="4"><animateMotion dur="2.8s" repeatCount="indefinite" path="M1040 60 L930 140"/></circle>
      <circle r="4"><animateMotion dur="3.6s" repeatCount="indefinite" path="M930 140 L1110 190"/></circle>
      <circle r="4"><animateMotion dur="2.2s" repeatCount="indefinite" path="M1030 255 L930 140"/></circle>
    </g>

    <!-- Hub central -->
    <circle cx="930" cy="140" r="60" fill="url(#glow)">
      <animate attributeName="r" values="45;70;45" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="930" cy="140" r="16" fill="#0d1117" stroke="#58a6ff" stroke-width="3"/>
    <circle cx="930" cy="140" r="6" fill="#58a6ff"/>
    <circle cx="930" cy="140" r="16" fill="none" stroke="#58a6ff" stroke-width="2">
      <animate attributeName="r" values="16;40" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>

    <!-- Nós -->
    <g class="float">
      <circle cx="760" cy="80" r="10" fill="#0d1117" stroke="#a371f7" stroke-width="2.5"/>
      <circle cx="760" cy="80" r="4" fill="#a371f7"/>
    </g>
    <g class="float2">
      <circle cx="880" cy="235" r="10" fill="#0d1117" stroke="#58a6ff" stroke-width="2.5"/>
      <circle cx="880" cy="235" r="4" fill="#58a6ff"/>
    </g>
    <g class="float">
      <circle cx="1040" cy="60" r="10" fill="#0d1117" stroke="#3fb950" stroke-width="2.5"/>
      <circle cx="1040" cy="60" r="4" fill="#3fb950"/>
    </g>
    <g class="float2">
      <circle cx="1110" cy="190" r="10" fill="#0d1117" stroke="#f0883e" stroke-width="2.5"/>
      <circle cx="1110" cy="190" r="4" fill="#f0883e"/>
    </g>
    <g class="float">
      <circle cx="1030" cy="255" r="10" fill="#0d1117" stroke="#a371f7" stroke-width="2.5"/>
      <circle cx="1030" cy="255" r="4" fill="#a371f7"/>
    </g>
  </g>

  <!-- Partículas flutuando ao fundo -->
  <g fill="#58a6ff" opacity="0.5">
    <circle cx="120" cy="280" r="2"><animate attributeName="cy" values="290;-10" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="290" r="2"><animate attributeName="cy" values="290;-10" dur="12s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="290" r="1.5"><animate attributeName="cy" values="290;-10" dur="10s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="290" r="2.5"><animate attributeName="cy" values="290;-10" dur="14s" begin="4s" repeatCount="indefinite"/></circle>
    <circle cx="1170" cy="290" r="2"><animate attributeName="cy" values="290;-10" dur="11s" begin="3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Texto (efeito de digitação) -->
  <g class="mono">
    <g clip-path="url(#clipCmd)">
      <text class="cmd" x="60" y="86">$ ./resolver_chamado.sh --nivel N1</text>
    </g>
    <g clip-path="url(#clipTitle)">
      <text class="title" x="60" y="160">Técnico em Informática</text>
    </g>
    <g clip-path="url(#clipSub)">
      <text class="sub" x="60" y="222">Help Desk • Suporte N1 • Atendimento</text>
    </g>

    <!-- Cursor piscando -->
    <rect x="60" y="130" width="14" height="34" fill="#58a6ff">
      <animate attributeName="x" values="60;700;700;60" keyTimes="0;0.3;0.9;1" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
    </rect>

    <text class="ok" x="60" y="268">● chamado resolvido com sucesso</text>
  </g>
</svg>
